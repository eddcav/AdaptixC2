name: Build AdaptixC2 Client

on:
  push:
    branches: [ testing-v2.0 ]
    paths:
      - 'AdaptixClient/**'
      - '.github/workflows/build-client.yml'
  pull_request:
    branches: [ testing-v2.0 ]
  workflow_dispatch:

jobs:
  # ==================== Linux (AppImage via Docker) ====================
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: testing-v2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Client via Docker (AppImage)
        run: |
          docker compose --profile build-client build
          docker compose --profile build-client up --abort-on-container-exit
          docker compose --profile build-client down

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/linux
          if [ -d AdaptixClient/client-dist ]; then
            cp -r AdaptixClient/client-dist/* artifacts/linux/ || true
          fi
          # 兼容可能的输出路径
          find . -name "AdaptixClient*.AppImage" -exec cp {} artifacts/linux/ \; || true
          find . -name "AdaptixClient" -type f -executable -exec cp {} artifacts/linux/ \; || true
          ls -lah artifacts/linux/ || true

      - name: Upload Linux Client
        uses: actions/upload-artifact@v4
        with:
          name: AdaptixClient-Linux-${{ github.sha }}
          path: artifacts/linux/
          retention-days: 14
          if-no-files-found: warn

  # ==================== macOS ====================
  build-macos:
    runs-on: macos-14          # Apple Silicon，也可改 macos-13 (Intel)
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: testing-v2.0

      - name: Install dependencies (Homebrew)
        run: |
          brew update
          brew install qt@6 cmake ninja openssl@3 pkg-config
          # 确保 cmake 能找到 Qt
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix qt@6)/bin:$PATH" >> $GITHUB_ENV

      - name: Build Client
        run: |
          cd AdaptixClient
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -G Ninja
          cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          mkdir -p artifacts/macos
          cp AdaptixClient/build/AdaptixClient artifacts/macos/ || \
          cp AdaptixClient/AdaptixClient artifacts/macos/ || true
          # 简单部署（可选，正式分发建议用 macdeployqt）
          if command -v macdeployqt >/dev/null 2>&1; then
            cd artifacts/macos
            macdeployqt AdaptixClient -verbose=1 || true
          fi
          ls -lah artifacts/macos/

      - name: Upload macOS Client
        uses: actions/upload-artifact@v4
        with:
          name: AdaptixClient-macOS-${{ github.sha }}
          path: artifacts/macos/
          retention-days: 14
          if-no-files-found: error

  # ==================== Windows (MSYS2) ====================
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: testing-v2.0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-websockets
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pkgconf
            make
            git

      - name: Build Client
        run: |
          cd AdaptixClient
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/ucrt64
          cmake --build build -j$(nproc)

      - name: Package with windeployqt
        run: |
          mkdir -p artifacts/windows
          cp AdaptixClient/build/AdaptixClient.exe artifacts/windows/
          
          # 部署 Qt 依赖
          export PATH="/ucrt64/bin:$PATH"
          cd artifacts/windows
          windeployqt-qt6 AdaptixClient.exe --release --no-translations || \
          windeployqt AdaptixClient.exe --release --no-translations || true

          # 补充常见运行库
          for dll in libwinpthread-1.dll libgcc_s_seh-1.dll libstdc++-6.dll \
                     libfreetype-6.dll libharfbuzz-0.dll libpng16-16.dll \
                     libbrotlidec.dll libbrotlicommon.dll zlib1.dll \
                     libcrypto-3-x64.dll libssl-3-x64.dll; do
            cp /ucrt64/bin/$dll . 2>/dev/null || true
          done

          ls -lah

      - name: Upload Windows Client
        uses: actions/upload-artifact@v4
        with:
          name: AdaptixClient-Windows-${{ github.sha }}
          path: artifacts/windows/
          retention-days: 14
          if-no-files-found: error
